    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>

    <div id="loader" class="loader">
      <div class="loader-content">
        <p class="brand"><svg class="brand-mark"><use href="#icon-mark" /></svg>airupt</p>
        <h1 class="loader-title" data-profile="name"></h1>
        <p class="loader-subtitle" data-profile="tagline"></p>
        <div class="loader-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        <button class="button button-primary button-large" id="start" disabled>Loading the islands</button>
        <button class="text-link" data-open-classic>or read it as a normal page</button>
      </div>
    </div>

    <div id="hud" class="hud" hidden>
      <div class="hud-top-left">
        <p class="brand brand-small"><svg class="brand-mark"><use href="#icon-mark" /></svg>airupt</p>
        <button class="chip chip-button" id="open-log" aria-label="Captain's log" aria-keyshortcuts="L" data-label="Captain's log" data-action="log"><svg class="icon"><use href="#icon-log" /></svg><span></span></button>
      </div>
      <div class="hud-top-right">
        <button class="icon-button" id="open-photo" aria-label="Photo mode" aria-keyshortcuts="P" data-label="Photo" data-action="photo">
          <svg class="icon"><use href="#icon-camera" /></svg>
        </button>
        <button class="icon-button" id="open-map" aria-label="Open the map" aria-keyshortcuts="M" data-label="Map" data-action="map">
          <svg class="icon"><use href="#icon-map" /></svg>
        </button>
        <button class="icon-button" id="sound-toggle" aria-label="Sound" aria-pressed="true" aria-keyshortcuts="N" data-label="Sound" data-action="sound">
          <svg class="icon icon-on"><use href="#icon-sound" /></svg>
          <svg class="icon icon-off"><use href="#icon-mute" /></svg>
        </button>
        <button class="icon-button" data-open-classic aria-label="Read as a normal page" aria-keyshortcuts="V" data-label="Read as a page" data-action="page">
          <svg class="icon"><use href="#icon-page" /></svg>
        </button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite">
        <p class="toast-title"></p>
        <p class="toast-text"></p>
      </div>

      <div class="controls" id="controls"></div>

      <div class="hud-prompt" id="prompt" hidden>
        <button class="prompt-button" id="prompt-button" aria-keyshortcuts="E"><kbd class="key" id="prompt-key">E</kbd><span class="prompt-tap" id="prompt-tap" hidden><svg class="icon"><use href="#icon-arrow" /></svg></span><span id="prompt-text"></span></button>
      </div>

      <div class="joystick" id="joystick" hidden><div class="joystick-knob"></div></div>
      <button class="boost-button" id="boost" aria-label="Boost (hold)" hidden><svg class="icon"><use href="#icon-boost" /></svg></button>

      <div class="course" id="course" role="status" hidden><span class="course-label"></span><button class="course-share" hidden>Share</button></div>
      <div class="course-arrow" id="course-arrow" aria-hidden="true" hidden><svg class="icon"><use href="#icon-arrow" /></svg></div>
    </div>

    <dialog id="panel" class="panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <form method="dialog" class="panel-close-form">
          <button class="icon-button icon-button-small" aria-label="Close" aria-keyshortcuts="Escape" data-label="Close" data-action="back">
            <svg class="icon"><use href="#icon-close" /></svg>
          </button>
        </form>
      </div>
      <div class="panel-body" tabindex="-1" autofocus></div>
    </dialog>

    <div class="photo-grid" id="photo-grid-lines" aria-hidden="true" hidden></div>
    <div class="photo-bar" id="photo-bar" tabindex="-1" hidden>
      <p class="photo-hint"></p>
      <div class="photo-lights" role="group" aria-label="Light" aria-keyshortcuts="[ ]" data-label="Light" data-action="light">
        <svg class="icon" aria-hidden="true"><use href="#icon-sun" /></svg>
        <button data-light aria-pressed="false">Dawn</button>
        <button data-light aria-pressed="false">Day</button>
        <button data-light aria-pressed="false">Golden</button>
        <button data-light aria-pressed="false">Sunset</button>
        <button data-light aria-pressed="false">Night</button>
      </div>
      <div class="photo-sliders">
        <label class="photo-control" data-label="Zoom" data-action="zoom">
          <svg class="icon" aria-hidden="true"><use href="#icon-zoom" /></svg>
          <span class="visually-hidden">Zoom</span>
          <input type="range" id="photo-zoom" min="0" max="1" step="0.01" aria-keyshortcuts="- =" />
        </label>
        <label class="photo-control" data-label="Background blur" data-action="blur">
          <svg class="icon" aria-hidden="true"><use href="#icon-blur" /></svg>
          <span class="visually-hidden">Background blur</span>
          <input type="range" id="photo-blur" min="0" max="12" step="0.5" aria-keyshortcuts="Q E" />
        </label>
      </div>
      <div class="photo-buttons">
        <button class="icon-button icon-button-small" id="photo-boat" aria-label="Show the boat" aria-pressed="true" aria-keyshortcuts="H" data-label="Boat" data-action="boat">
          <svg class="icon"><use href="#icon-boat" /></svg>
        </button>
        <button class="icon-button icon-button-small" id="photo-grid" aria-label="Framing grid" aria-pressed="false" aria-keyshortcuts="G" data-label="Grid" data-action="grid">
          <svg class="icon"><use href="#icon-grid" /></svg>
        </button>
        <button class="icon-button icon-button-small" id="photo-reset" aria-label="Back to the usual view" aria-keyshortcuts="R" data-label="Usual view" data-action="view">
          <svg class="icon"><use href="#icon-reset" /></svg>
        </button>
        <button class="photo-shutter" id="photo-shutter" aria-label="Take the photo" aria-keyshortcuts="Space" data-label="Take the photo" data-action="shutter"></button>
        <button class="icon-button icon-button-small" id="photo-exit" aria-label="Leave photo mode" aria-keyshortcuts="Escape P" data-label="Close" data-action="back">
          <svg class="icon"><use href="#icon-close" /></svg>
        </button>
      </div>
    </div>
    <div class="photo-flash" id="photo-flash" aria-hidden="true"></div>
    <div class="photo-preview" id="photo-preview" role="dialog" aria-label="Your photo" hidden>
      <img alt="The photo you just took" />
      <div class="photo-actions">
        <button class="button" data-save aria-keyshortcuts="S" data-label="Save" data-action="save">Save</button>
        <button class="button" data-share aria-keyshortcuts="D" data-label="Share" data-action="share" hidden>Share</button>
        <button class="button button-quiet" data-close aria-keyshortcuts="Escape" data-label="Back" data-action="back">Keep shooting</button>
      </div>
    </div>

    <dialog id="logbook" class="logbook" aria-labelledby="logbook-title">
      <form method="dialog" class="dialog-header">
        <h2 id="logbook-title" tabindex="-1" autofocus>Captain's log</h2>
        <button class="icon-button icon-button-small" aria-label="Close the log" aria-keyshortcuts="L Escape" data-label="Close" data-action="log">
          <svg class="icon"><use href="#icon-close" /></svg>
        </button>
      </form>
      <div class="logbook-body"></div>
    </dialog>

    <dialog id="map" class="map" aria-labelledby="map-title">
      <form method="dialog" class="dialog-header">
        <h2 id="map-title" tabindex="-1" autofocus>Where to?</h2>
        <button class="icon-button icon-button-small" aria-label="Close map" aria-keyshortcuts="M Escape" data-label="Close" data-action="map">
          <svg class="icon"><use href="#icon-close" /></svg>
        </button>
      </form>
      <div class="map-layout">
        <div class="map-chart"></div>
        <div class="map-list"></div>
      </div>
    </dialog>

    <div id="classic" class="classic" tabindex="-1" hidden></div>

    </noscript>
