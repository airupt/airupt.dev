  </head>
  <body>
    <!-- Shared icon set, referenced with <use href="#icon-…"> -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <!-- The brand mark is the round profile picture -->
        <symbol id="icon-mark" viewBox="0 0 32 32">
          <image href="/avatar.png" width="32" height="32" />
        </symbol>
        <symbol id="icon-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14" /></symbol>
        <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Zm12.5-.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></symbol>
        <symbol id="icon-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Zm13 0 5 6m0-6-5 6" /></symbol>
        <symbol id="icon-page" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Zm3 8h7m-7 4h7M9 7h3" /></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
        <symbol id="icon-bottle" viewBox="0 0 24 24"><path d="M10 2h4v4l2 3v12H8V9l2-3Zm-2 11h8" /></symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h13m-6-6 6 6-6 6" /></symbol>
        <symbol id="icon-log" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0Zm16 0C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0Z" /></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
        <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M3.5 8h3.5l2-3h6l2 3h3.5v11h-17Zm8.5 9a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" /></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0-14v2.5m0 15V22M2 12h2.5m15 0H22M4.9 4.9l1.8 1.8m10.6 10.6 1.8 1.8m0-14.2-1.8 1.8M6.7 17.3l-1.8 1.8" /></symbol>
        <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></symbol>
        <symbol id="icon-zoom" viewBox="0 0 24 24"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13Zm4.6-1.9L20 20" /></symbol>
      </defs>
    </svg>

    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>

    <div id="loader" class="loader">
      <div class="loader-content">
        <p class="brand"><svg class="brand-mark"><use href="#icon-mark" /></svg>airupt</p>
        <h1 class="loader-title" data-profile="name"></h1>
        <p class="loader-subtitle" data-profile="tagline"></p>
        <div class="loader-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        <button class="button button-primary button-large" id="start" disabled>Loading the islands</button>
        <button class="text-link" data-open-classic>or read it as a normal page</button>
      </div>
    </div>

    <div id="hud" class="hud" hidden>
      <div class="hud-top-left">
        <p class="brand brand-small"><svg class="brand-mark"><use href="#icon-mark" /></svg>airupt</p>
        <button class="chip chip-button" id="open-log" aria-label="Captain's log" aria-keyshortcuts="L" data-tooltip="Captain's log · L"><svg class="icon"><use href="#icon-log" /></svg><span></span></button>
      </div>
      <div class="hud-top-right">
        <button class="icon-button" id="open-photo" aria-label="Photo mode" aria-keyshortcuts="P" data-tooltip="Photo · P">
          <svg class="icon"><use href="#icon-camera" /></svg>
        </button>
        <button class="icon-button" id="open-map" aria-label="Open the map" aria-keyshortcuts="M" data-tooltip="Map · M">
          <svg class="icon"><use href="#icon-map" /></svg>
        </button>
        <button class="icon-button" id="sound-toggle" aria-label="Sound" aria-pressed="true" aria-keyshortcuts="N" data-tooltip="Sound · N">
          <svg class="icon icon-on"><use href="#icon-sound" /></svg>
          <svg class="icon icon-off"><use href="#icon-mute" /></svg>
        </button>
        <button class="icon-button" data-open-classic aria-label="Read as a normal page" aria-keyshortcuts="V" data-tooltip="Read as a page · V">
          <svg class="icon"><use href="#icon-page" /></svg>
        </button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite">
        <p class="toast-title"></p>
        <p class="toast-text"></p>
      </div>

      <div class="controls" id="controls"></div>

      <div class="hud-prompt" id="prompt" hidden>
        <button class="prompt-button" id="prompt-button"><kbd class="key" id="prompt-key">E</kbd><span class="prompt-tap" id="prompt-tap" hidden><svg class="icon"><use href="#icon-arrow" /></svg></span><span id="prompt-text"></span></button>
      </div>

      <div class="joystick" id="joystick" hidden><div class="joystick-knob"></div></div>

      <div class="course" id="course" role="status" hidden><span class="course-label"></span><button class="course-share" hidden>Share</button></div>
      <div class="course-arrow" id="course-arrow" aria-hidden="true" hidden><svg class="icon"><use href="#icon-arrow" /></svg></div>
    </div>

    <dialog id="panel" class="panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <form method="dialog" class="panel-close-form">
          <button class="icon-button icon-button-small" aria-label="Close" data-tooltip="Close · Esc">
            <svg class="icon"><use href="#icon-close" /></svg>
          </button>
        </form>
      </div>
      <div class="panel-body" tabindex="-1" autofocus></div>
    </dialog>

    <div class="photo-bar" id="photo-bar" hidden>
      <p class="photo-hint"></p>
      <label class="photo-control" data-tooltip="Light · [ ]">
        <svg class="icon" aria-hidden="true"><use href="#icon-sun" /></svg>
        <span class="visually-hidden">Time of day</span>
        <input type="range" id="photo-time" min="0" max="1" step="0.001" aria-keyshortcuts="[ ]" />
      </label>
      <label class="photo-control" data-tooltip="Zoom · − =">
        <svg class="icon" aria-hidden="true"><use href="#icon-zoom" /></svg>
        <span class="visually-hidden">Zoom</span>
        <input type="range" id="photo-zoom" step="0.5" aria-keyshortcuts="- =" />
      </label>
      <button class="icon-button icon-button-small" id="photo-reset" aria-label="Back to the usual view" aria-keyshortcuts="R" data-tooltip="Usual view · R">
        <svg class="icon"><use href="#icon-reset" /></svg>
      </button>
      <button class="photo-shutter" id="photo-shutter" aria-label="Take the photo" aria-keyshortcuts="Space" data-tooltip="Take the photo · Space"></button>
      <button class="icon-button icon-button-small" id="photo-exit" aria-label="Leave photo mode" aria-keyshortcuts="Escape P" data-tooltip="Close · Esc">
        <svg class="icon"><use href="#icon-close" /></svg>
      </button>
    </div>
    <div class="photo-flash" id="photo-flash" aria-hidden="true"></div>
    <div class="photo-preview" id="photo-preview" role="dialog" aria-label="Your photo" hidden>
      <img alt="The photo you just took" />
      <div class="photo-actions">
        <button class="button" data-save aria-keyshortcuts="S" data-tooltip="Save · S">Save</button>
        <button class="button" data-share hidden>Share</button>
        <button class="button button-quiet" data-close aria-keyshortcuts="Escape" data-tooltip="Back · Esc">Keep shooting</button>
      </div>
    </div>

    <dialog id="logbook" class="logbook" aria-labelledby="logbook-title">
      <form method="dialog" class="dialog-header">
        <h2 id="logbook-title" tabindex="-1" autofocus>Captain's log</h2>
        <button class="icon-button icon-button-small" aria-label="Close the log" data-tooltip="Close · L">
          <svg class="icon"><use href="#icon-close" /></svg>
        </button>
      </form>
      <div class="logbook-body"></div>
    </dialog>

    <dialog id="map" class="map" aria-labelledby="map-title">
      <form method="dialog" class="dialog-header">
        <h2 id="map-title" tabindex="-1" autofocus>Where to?</h2>
        <button class="icon-button icon-button-small" aria-label="Close map" data-tooltip="Close · M">
          <svg class="icon"><use href="#icon-close" /></svg>
        </button>
      </form>
      <div class="map-layout">
        <div class="map-chart"></div>
        <div class="map-list"></div>
      </div>
    </dialog>

    <div id="classic" class="classic" hidden></div>

    <noscript>
      <p class="noscript">This portfolio needs JavaScript to run.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>

  </body>
</html>
