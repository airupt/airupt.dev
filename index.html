<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Airupt</title>
    <meta name="description" content="Developer portfolio. Sail a little boat between islands to explore projects, skills and more." />
    <meta name="theme-color" content="#0d3558" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>

    <div id="loader" class="loader">
      <div class="loader-card">
        <h1 class="loader-title" data-profile="name"></h1>
        <p class="loader-subtitle" data-profile="tagline"></p>
        <div class="loader-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        <div class="loader-actions">
          <button class="button button-primary" id="start" disabled>Loading…</button>
          <button class="button" data-open-classic>Classic view</button>
        </div>
      </div>
    </div>

    <div id="hud" class="hud" hidden>
      <p class="hud-hint" id="hint"></p>
      <div class="hud-prompt" id="prompt" hidden>
        <button class="button button-primary" id="prompt-button"></button>
      </div>
      <div class="hud-corner">
        <button class="button" id="sound-toggle" aria-pressed="true">Sound on</button>
        <button class="button" data-open-classic>Classic view</button>
      </div>
      <div class="joystick" id="joystick" hidden><div class="joystick-knob"></div></div>
    </div>

    <dialog id="panel" class="panel">
      <form method="dialog" class="panel-close-form">
        <button class="button panel-close" aria-label="Close">Close</button>
      </form>
      <div class="panel-body"></div>
    </dialog>

    <div id="classic" class="classic" hidden></div>

    <noscript>
      <p class="noscript">This portfolio needs JavaScript to run.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
